name: CI

on:
  push:
    branches: 
      - main

env:
  IMAGE_NAME: {{ secrets.DOCKER_USERNAME }}/learning-java:

jobs:
  build:
    name: Build java app
    environment: test
    runs-on: self-hosted

    steps:
      - name: Checkout source code 
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven

      - name: Check Version
        run: java -version && mvn -version

      - name: Build jar file
        run: mvn clean package
      
      - name: Login to dockerhub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
          
      - name: Build and push Docker image
        uses: docker/build-push-action@v5
        with:
          context: .
          push: true
          tags: |
            binyul11/learning-java:latest
            binyul11/learning-java:${{ github.sha }}
            binyul11/learning-java:${{ github.run_number }}













